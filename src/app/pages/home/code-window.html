<figure class="band-navy code-window overflow-hidden rounded-3xl border border-line">
  <div class="flex items-center gap-4 border-b border-line px-4 py-3 sm:px-5">
    <div class="flex gap-1.5" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <p class="min-w-0 flex-1 truncate font-mono text-xs text-muted">src/app/data/profile.ts</p>
    <a
      [href]="sourceUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="-mr-2 inline-flex min-h-9 items-center gap-1 rounded-full px-2 text-xs font-semibold text-muted transition-colors hover:text-ink"
    >
      View source<span class="sr-only"> of profile.ts on GitHub (opens in a new tab)</span>
      <app-icon name="arrow-up-right" class="size-3.5" />
    </a>
  </div>

  <!-- Kept on one line: whitespace inside <pre> is significant. -->
  <pre class="code font-mono"><code>@for (line of lines; track $index; let i = $index, last = $last) {<span class="line" [style.--line]="i">@for (token of line; track $index) {<span [class]="'tok-' + token.kind">{{ token.text }}</span>}@if (last) {<span class="caret" aria-hidden="true"></span>}</span>}</code></pre>

  <figcaption class="flex flex-wrap items-center justify-between gap-x-6 gap-y-4 border-t border-line px-4 py-4 sm:px-5">
    <div>
      <p class="text-sm font-semibold text-ink">Lighthouse · {{ lighthouse.formFactor }}</p>
      <p class="mt-1 text-xs text-muted">
        Measured
        <time [attr.datetime]="lighthouse.measuredOn">{{ lighthouse.measuredOn | date: 'MMM d, y' }}</time>
        ·
        <a
          [href]="verifyUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="font-semibold text-accent underline-offset-4 hover:underline"
        >
          Verify it yourself<span class="sr-only"> on PageSpeed Insights (opens in a new tab)</span>
        </a>
      </p>
    </div>

    <ul class="flex gap-3 sm:gap-4">
      @for (item of lighthouse.scores; track item.label) {
        <li class="flex flex-col items-center gap-1.5" [class]="'gauge-' + band(item.score)">
          <span class="relative grid size-11 place-items-center">
            <svg viewBox="0 0 36 36" class="absolute inset-0 -rotate-90" aria-hidden="true">
              <circle cx="18" cy="18" r="16" pathLength="100" class="gauge-track" />
              <circle
                cx="18"
                cy="18"
                r="16"
                pathLength="100"
                class="gauge-value"
                [attr.stroke-dashoffset]="100 - item.score"
              />
            </svg>
            <span class="text-sm font-semibold tabular-nums" aria-hidden="true">{{ item.score }}</span>
          </span>
          <span class="font-mono text-[0.6875rem] uppercase tracking-wider text-muted" aria-hidden="true">
            {{ item.short }}
          </span>
          <span class="sr-only">{{ item.label }}: {{ item.score }} out of 100</span>
        </li>
      }
    </ul>
  </figcaption>
</figure>
